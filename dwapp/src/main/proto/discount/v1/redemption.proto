syntax = "proto3";

package discount.v1;

option java_multiple_files = true;
option java_package = "com.discountworld.discount";

import "google/protobuf/timestamp.proto";
import "discount/v1/common.proto";

// ─────────────────────────────────────────────
// Customer Messages
// ─────────────────────────────────────────────

message Customer {
  int64 id = 1;
  int64 client_id = 2;
  string cnic = 3;
  string email = 4;
  string full_name = 5;
  string phone_number = 6;
  bool active = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  int32 reward_points = 10;
}

message CustomerCnicAuthRequest {
  string cnic = 1;
  optional string full_name = 2;
  optional string phone_number = 3;
  optional string email = 4;
}

message CustomerCnicAuthResponse {
  string access_token = 1;
  Customer customer = 2;
  bool is_new_customer = 3;
}

message GetCustomerProfileRequest {}

message UpdateCustomerProfileRequest {
  string email = 1;
  string full_name = 2;
  string phone_number = 3;
}

message ListCustomersRequest {
  int64 client_id = 1;
  int32 page = 2;
  int32 page_size = 3;
  string search = 4;
}

message ListCustomersResponse {
  repeated Customer customers = 1;
  int32 total_count = 2;
}

// ─────────────────────────────────────────────
// Category Messages
// ─────────────────────────────────────────────

message RedemptionCategory {
  int64 id = 1;
  string name = 2;
  string description = 3;
  string image_url = 4;
  int32 sort_order = 5;
}

message RedemptionVendorCategory {
  int64 id = 1;
  string name = 2;
}

message ListRedemptionCategoriesRequest {}

message ListRedemptionCategoriesResponse {
  repeated RedemptionCategory categories = 1;
}

// ─────────────────────────────────────────────
// City Messages
// ─────────────────────────────────────────────

message RedemptionCity {
  int64 id = 1;
  string name = 2;
  string country = 3;
  bool featured = 4;
  int32 sort_order = 5;
}

message ListRedemptionCitiesRequest {
  optional bool featured_only = 1;
}

message ListRedemptionCitiesResponse {
  repeated RedemptionCity cities = 1;
}

// ─────────────────────────────────────────────
// Branch Messages
// ─────────────────────────────────────────────

message RedemptionBranch {
  int64 id = 1;
  string name = 2;
  string address = 3;
  int64 city_id = 4;
  string city_name = 5;
  double latitude = 6;
  double longitude = 7;
  string phone_number = 8;
}

// ─────────────────────────────────────────────
// Vendor Messages
// ─────────────────────────────────────────────

message RedemptionVendorSummary {
  int64 id = 1;
  string company_name = 2;
  string logo_url = 3;
  string banner_url = 4;
  string description = 5;
  bool featured = 6;
  string title = 7;
  int32 sort_order = 8;
  repeated RedemptionVendorCategory categories = 9;
  bool in_store = 10;
  bool delivery = 11;
  bool ecommerce = 12;
  string short_description = 13;
}

message ListRedemptionVendorsRequest {
  int32 page = 1;
  int32 page_size = 2;
  optional int64 city_id = 3;
  optional int64 category_id = 4;
  optional string search = 5;
  optional bool featured = 6;
  optional bool in_store = 7;
  optional bool delivery = 8;
  optional bool ecommerce = 9;
}

message ListRedemptionVendorsResponse {
  repeated RedemptionVendorSummary vendors = 1;
  int32 total_count = 2;
}

message RedemptionVendorDetail {
  int64 id = 1;
  string company_name = 2;
  string logo_url = 3;
  string description = 4;
  bool featured = 5;
  string head_office_number = 6;
  string terms_and_conditions = 7;
  string title = 8;
  bool in_store = 9;
  bool delivery = 10;
  bool ecommerce = 11;
  bool show_on_map = 12;
  repeated RedemptionCategory categories = 13;
  repeated RedemptionBranch branches = 14;
  repeated string gallery_images = 15;
  repeated RedemptionSocialLink social_links = 16;
  string short_description = 17;
}

message GetRedemptionVendorDetailRequest {
  int64 vendor_id = 1;
  optional int64 city_id = 2;
}

message GetRedemptionVendorDetailResponse {
  RedemptionVendorDetail vendor = 1;
}

// ─────────────────────────────────────────────
// Map Messages
// ─────────────────────────────────────────────

message RedemptionMapPin {
  int64 branch_id = 1;
  int64 vendor_id = 2;
  string vendor_title = 3;
  string vendor_logo_url = 4;
  string branch_name = 5;
  string address = 6;
  double latitude = 7;
  double longitude = 8;
  string phone_number = 9;
}

message ListMapPinsRequest {
  int64 city_id = 1;
  optional int64 category_id = 2;
}

message ListMapPinsResponse {
  repeated RedemptionMapPin pins = 1;
}

message RedemptionSocialLink {
  int64 id = 1;
  string platform = 2;
  string url = 3;
}

// ─────────────────────────────────────────────
// Banner Messages (Home Carousel & Popular Vendors)
// ─────────────────────────────────────────────

message RedemptionBannerItem {
  int64 id = 1;
  int64 banner_id = 2;
  string title = 3;
  string image_url = 4;
  string link_url = 5;
  int32 sort_order = 6;
  int64 vendor_id = 7;
  string vendor_company_name = 8;
  string vendor_title = 9;
  string vendor_logo_url = 10;
}

message ListRedemptionBannersRequest {
  optional int64 city_id = 1;
}

message ListRedemptionBannersResponse {
  repeated RedemptionBannerItem banners = 1;
  repeated RedemptionVendorSummary popular_vendors = 2;
}

// ─────────────────────────────────────────────
// Story Messages
// ─────────────────────────────────────────────

message RedemptionStory {
  int64 vendor_id = 1;
  string vendor_title = 2;
  string vendor_logo_url = 3;
  int32 story_sort_order = 4;
}

message ListStoriesRequest {
  int64 city_id = 1;
}

message ListStoriesResponse {
  repeated RedemptionStory stories = 1;
}

// ─────────────────────────────────────────────
// Vendor Deals / Offers Messages
// ─────────────────────────────────────────────

message RedemptionDealSummary {
  int64 id = 1;
  int64 vendor_id = 2;
  string unique_code = 3;
  string title = 4;
  string description = 5;
  string deal_type = 6;
  double deal_value = 7;
  double estimated_price = 8;
  double estimated_saving = 9;
  double discounted_price = 10;
  string custom_message_1 = 11;
  string custom_message_2 = 12;
  int32 max_redemptions = 13;
  int32 usage_per_user = 14;
  int32 redeem_points = 15;
  int32 sort_order = 16;
  bool featured = 17;
  google.protobuf.Timestamp start_date = 18;
  google.protobuf.Timestamp end_date = 19;
}

message ListVendorDealsRequest {
  int64 vendor_id = 1;
}

message ListVendorDealsResponse {
  repeated RedemptionDealSummary deals = 1;
}

// ─────────────────────────────────────────────
// Deal Redemption Transaction Messages
// ─────────────────────────────────────────────

message RedeemDealRequest {
  int64 deal_id = 1;
  optional string redeem_pin = 2;
  optional int64 city_id = 3;
}

message RedeemDealResponse {
  bool success = 1;
  string message = 2;
  string redemption_code = 3;
  string custom_message_1 = 4;
  string custom_message_2 = 5;
  int32 points_earned = 6;
  google.protobuf.Timestamp redeemed_at = 7;
  string category_name = 8;
  string city_name = 9;
}

// ─────────────────────────────────────────────
// Redemption History Messages
// ─────────────────────────────────────────────

message RedemptionHistoryItem {
  int64 id = 1;
  int64 client_id = 2;
  string client_name = 3;
  int64 vendor_id = 4;
  string vendor_title = 5;
  string vendor_logo_url = 6;
  int64 deal_id = 7;
  string offer_title = 8;
  string category_name = 9;
  string city_name = 10;
  string redemption_code = 11;
  int64 customer_id = 12;
  string customer_name = 13;
  string customer_cnic = 14;
  string customer_phone = 15;
  string customer_email = 16;
  double estimated_price = 17;
  double estimated_saving = 18;
  double discounted_price = 19;
  int32 points_earned = 20;
  string vendor_type = 21;
  google.protobuf.Timestamp redeemed_at = 22;
}

message ListRedemptionsRequest {
  PaginationRequest pagination = 1;
  optional int64 client_id = 2;
  optional int64 vendor_id = 3;
  optional int64 city_id = 4;
  optional string offer_title = 5;
  optional string search = 6;
  optional google.protobuf.Timestamp start_date = 7;
  optional google.protobuf.Timestamp end_date = 8;
}

message ListRedemptionsResponse {
  repeated RedemptionHistoryItem items = 1;
  PaginationResponse pagination = 2;
  int64 total_count = 3;
  double total_savings = 4;
}

// ─────────────────────────────────────────────
// Unified Redemption Service (Mobile App & Web)
// ─────────────────────────────────────────────

service RedemptionService {
  // Customer Auth & Profile
  rpc AuthenticateByCnic(CustomerCnicAuthRequest) returns (CustomerCnicAuthResponse);
  rpc GetCustomerProfile(GetCustomerProfileRequest) returns (Customer);
  rpc UpdateCustomerProfile(UpdateCustomerProfileRequest) returns (Customer);
  rpc ListCustomers(ListCustomersRequest) returns (ListCustomersResponse);

  // Categories & Cities (Client-scoped)
  rpc ListCategories(ListRedemptionCategoriesRequest) returns (ListRedemptionCategoriesResponse);
  rpc ListCities(ListRedemptionCitiesRequest) returns (ListRedemptionCitiesResponse);

  // Vendors (Client-scoped)
  rpc ListVendors(ListRedemptionVendorsRequest) returns (ListRedemptionVendorsResponse);
  rpc GetVendorDetail(GetRedemptionVendorDetailRequest) returns (GetRedemptionVendorDetailResponse);

  // Home Banners & Popular Vendors (Client-scoped)
  rpc ListBanners(ListRedemptionBannersRequest) returns (ListRedemptionBannersResponse);

  // Vendor Deals & Offers (Client-scoped with custom sort order)
  rpc ListVendorDeals(ListVendorDealsRequest) returns (ListVendorDealsResponse);

  // Deal Redemption Engine
  rpc RedeemDeal(RedeemDealRequest) returns (RedeemDealResponse);

  // Redemption History Dashboard
  rpc ListRedemptions(ListRedemptionsRequest) returns (ListRedemptionsResponse);

  // Map View (Client-scoped)
  rpc ListMapPins(ListMapPinsRequest) returns (ListMapPinsResponse);

  // Stories (Client-scoped)
  rpc ListStories(ListStoriesRequest) returns (ListStoriesResponse);

}
